[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reference-sensitive-causal-effects"
version = "0.1.0"
description = "Cross-fitted estimation of reference-specific natural effects"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.9",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "ipywidgets>=8",
]
text = [
    "sentence-transformers>=3",
]
vision = [
    "insightface>=0.7.3",
    "onnxruntime>=1.17",
    "opencv-python>=4.8",
    "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
